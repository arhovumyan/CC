<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Match Duel — match-3 prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    background: #1e1e26;
    color: #eee;
    font-family: -apple-system, system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100dvh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #menu-shell {
    display: none;
    width: 100%;
    max-width: 100vw;
    max-height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding:
      max(12px, env(safe-area-inset-top, 0))
      max(12px, env(safe-area-inset-right, 0))
      max(12px, env(safe-area-inset-bottom, 0))
      max(12px, env(safe-area-inset-left, 0));
    box-sizing: border-box;
  }
  #menu-shell.show { display: flex; }
  #hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 2.5vw, 24px);
    row-gap: 6px;
    margin-bottom: clamp(6px, 1.5vw, 14px);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    width: 100%;
    max-width: 100%;
    padding: 0 4px;
  }
  #hud > div { text-align: center; min-width: 52px; }
  #hud .label { color: #9a9aae; font-size: clamp(10px, 2.8vw, 14px); text-transform: uppercase; letter-spacing: 0.5px; }
  #hud .val { font-size: clamp(16px, 4.5vw, 24px); font-weight: 600; }
  .wallet-coins {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .wallet-coins .coin-icon {
    width: clamp(20px, 5vw, 28px);
    height: clamp(20px, 5vw, 28px);
    object-fit: contain;
    display: block;
  }
  /* A reserved, right-aligned row above the board — it lives OUTSIDE the grid and
     its space is always reserved, so fading it in never reflows anything. */
  #combo-bonus {
    width: min(94vw, calc(100dvh - 10.5rem));
    max-width: 100%;
    height: 20px;
    margin-bottom: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  #combo-bonus.active { opacity: 1; }
  #combo-bonus .bonus-label {
    font-size: clamp(10px, 2.6vw, 13px);
    color: #ffe14d;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  #combo-bonus .bonus-track {
    width: clamp(90px, 28vw, 180px);
    height: 6px;
    background: #3a3a48;
    border-radius: 3px;
    overflow: hidden;
  }
  #combo-bonus .bonus-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ffe14d, #ff9f43);
    border-radius: 3px;
    transform-origin: left center;
    transition: transform 0.05s linear;
  }
  #game-ui {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 100vw;
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    padding:
      max(clamp(6px, 2vw, 12px), env(safe-area-inset-top, 0))
      max(clamp(6px, 2vw, 12px), env(safe-area-inset-right, 0))
      max(clamp(6px, 2vw, 12px), env(safe-area-inset-bottom, 0))
      max(clamp(6px, 2vw, 12px), env(safe-area-inset-left, 0));
    box-sizing: border-box;
  }
  #board-area {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    position: relative;
    --board-size: min(94vw, calc(100dvh - 10.5rem), 100%);
    width: var(--board-size);
    height: var(--board-size);
    max-width: 100%;
    max-height: 100%;
    flex-shrink: 1;
  }
  #game {
    background: #2a2a36;
    border-radius: 8px;
    cursor: pointer;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  /* Faint cell separators ("boxes") drawn over the board. --cols/--rows are set
     in JS to match the current grid; lines sit at each cell boundary at low
     opacity so they're barely visible and never look strict. */
  #grid-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 8px;
    --cols: 8;
    --rows: 8;
    background-image:
      repeating-linear-gradient(to right, rgba(255,255,255,0.3) 0 1px, transparent 1px calc(100% / var(--cols))),
      repeating-linear-gradient(to bottom, rgba(255,255,255,0.3) 0 1px, transparent 1px calc(100% / var(--rows)));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
  }
  #fx { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; }
  #overlay {
    position: absolute; inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20,20,28,0.82);
    border-radius: 8px;
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay .big { font-size: clamp(22px, 6vw, 38px); font-weight: 700; padding: 0 12px; }
  #overlay .sub { font-size: clamp(14px, 3.5vw, 18px); color: #c5c5d6; margin-top: 10px; padding: 0 12px; }
  #hint {
    margin-top: clamp(4px, 1vw, 10px);
    color: #8a8a9c;
    font-size: clamp(11px, 2.8vw, 13px);
    text-align: center;
    padding: 0 8px;
    flex-shrink: 0;
    max-width: 100%;
  }

  #splash {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #1e1e26;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #splash img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  @media (max-width: 768px) {
    #splash img { object-fit: contain; }
  }
  #splash img.active {
    display: block;
  }

  #coin-fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 900;
  }

  /* Level cleared — centered art + buttons; coins fall behind (z-index 900). */
  #level-pass {
    position: fixed;
    inset: 0;
    z-index: 910;
    display: none;
    align-items: center;
    justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    box-sizing: border-box;
    pointer-events: none;
  }
  /* Dims only the game layer — sits below coins (900) and level-pass UI (910). */
  #win-dim {
    position: fixed;
    inset: 0;
    z-index: 850;
    background: rgba(12, 12, 18, 0.78);
    display: none;
    pointer-events: none;
  }
  #win-dim.show { display: block; }

  #level-pass.show {
    display: flex;
    pointer-events: auto;
  }
  #level-pass .level-pass-panel {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(480px, 72vw);
    max-height: 94dvh;
    transform-origin: center center;
    opacity: 0;
    transform: scale(0.06);
  }
  #level-pass.show.enter-in .level-pass-panel {
    animation:
      level-pass-fade-in 1s ease-out forwards,
      level-pass-pop-in 0.5s cubic-bezier(0.34, 1.55, 0.64, 1) forwards;
  }
  @keyframes level-pass-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes level-pass-pop-in {
    0% { transform: scale(0.06); }
    62% { transform: scale(1.1); }
    80% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  @media (min-width: 769px) {
    #level-pass .level-pass-panel {
      width: min(672px, 85vw);
    }
  }
  #level-pass .level-pass-banner {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
  }
  #level-pass .level-pass-actions {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: clamp(10px, 3vw, 22px);
    width: 100%;
    margin-top: clamp(6px, 1.2vw, 14px);
  }
  #level-pass .level-pass-btn {
    flex: 1 1 0;
    min-width: 0;
    max-width: 50%;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #level-pass .level-pass-btn img {
    width: 100%;
    height: auto;
    display: block;
  }
  #btn-next-level.pulsing img {
    animation: level-pass-pulse 0.55s ease-in-out infinite;
  }
  @keyframes level-pass-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @media (max-width: 768px) {
    #level-pass .level-pass-panel {
      width: min(94vw, 520px);
    }
  }

  #level-menu {
    display: none;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(6px, 2vw, 14px);
    background: #2a2a36;
    padding: clamp(12px, 4vw, 28px);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    width: min(100%, 380px);
    max-width: calc(100vw - 24px);
  }
  .level-btn {
    width: 100%;
    aspect-ratio: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e26;
    border-radius: clamp(8px, 2vw, 12px);
    font-size: clamp(15px, 4.5vw, 26px);
    font-weight: bold;
    color: #555;
    cursor: not-allowed;
    user-select: none;
    touch-action: manipulation;
  }
  .level-btn.active {
    background: #e84d57;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(232, 77, 87, 0.4);
    transition: transform 0.1s, background 0.1s;
  }
  .level-btn.active:hover {
    background: #ff6670;
    transform: scale(1.05);
  }
  .level-btn.active:active {
    transform: scale(0.95);
  }

  /* Lives shown above the level grid (spans all 5 columns) and in the HUD. */
  #hearts-bar {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 4vw, 28px);
    margin-bottom: 6px;
    font-size: clamp(18px, 5vw, 26px);
  }
  #hearts-bar .menu-coins {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(16px, 4.5vw, 22px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #hearts-bar .menu-coins .coin-icon {
    width: clamp(22px, 5.5vw, 30px);
    height: clamp(22px, 5.5vw, 30px);
    object-fit: contain;
  }
  #hearts-bar .regen { font-size: clamp(11px, 2.8vw, 13px); color: #9a9aae; font-variant-numeric: tabular-nums; }
  .heart-full { color: #e84d57; }
  .heart-empty { color: #4a4a58; }

  #menu-btn {
    margin-top: clamp(6px, 1.5vw, 12px);
    padding: 10px 20px;
    background: #2a2a36;
    color: #c5c5d6;
    border: 1px solid #3a3a48;
    border-radius: 8px;
    font: inherit;
    font-size: clamp(13px, 3.5vw, 14px);
    cursor: pointer;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  #menu-btn:hover { background: #353543; color: #fff; }

  @media (max-height: 520px) {
    #wrap { --board-size: min(88vw, calc(100dvh - 7rem)); }
    #hint { display: none; }
  }
</style>

<script>
"use strict";

// ============================================================================
// Core game logic — ported faithfully from the C# (Board / MatchFinder /
// SeededRandom). Zero rendering concerns live in here.
// Convention: grid is grid[x][y], y=0 is the BOTTOM row. Tiles fall toward y=0.
// ============================================================================

const EMPTY = -1;

// mulberry32 — deterministic: same seed => same sequence.
class SeededRandom {
  constructor(seed) { this.state = seed >>> 0; }
  nextUInt() {
    this.state = (this.state + 0x6D2B79F5) >>> 0;
    let t = this.state;
    t = Math.imul(t ^ (t >>> 15), t | 1) >>> 0;
    t = (t ^ (t + (Math.imul(t ^ (t >>> 7), t | 61) >>> 0))) >>> 0;
    return (t ^ (t >>> 14)) >>> 0;
  }
  next(maxExclusive) { return this.nextUInt() % maxExclusive; }
}

// Returns the set of "x,y" cells that are part of any horizontal/vertical 3+ run.
function findMatches(grid, width, height) {
  const matched = new Set();

  // Horizontal runs
  for (let y = 0; y < height; y++) {
    let runStart = 0;
    for (let x = 1; x <= width; x++) {
      const same = x < width && grid[x][y] !== EMPTY && grid[x][y] === grid[runStart][y];
      if (!same) {
        if (x - runStart >= 3 && grid[runStart][y] !== EMPTY)
          for (let k = runStart; k < x; k++) matched.add(k + "," + y);
        runStart = x;
      }
    }
  }

  // Vertical runs
  for (let x = 0; x < width; x++) {
    let runStart = 0;
    for (let y = 1; y <= height; y++) {
      const same = y < height && grid[x][y] !== EMPTY && grid[x][y] === grid[x][runStart];
      if (!same) {
        if (y - runStart >= 3 && grid[x][runStart] !== EMPTY)
          for (let k = runStart; k < y; k++) matched.add(x + "," + k);
        runStart = y;
      }
    }
  }

  return matched;
}

class Board {
  constructor(width, height, colorCount, seed) {
    this.width = width;
    this.height = height;
    this.colorCount = colorCount;
    this.rng = new SeededRandom(seed);
    this.grid = Array.from({ length: width }, () => new Array(height).fill(EMPTY));

    this.fillNoMatches();
    let safety = 0;
    while (!this.hasValidMove() && safety++ < 50) this.fillNoMatches();
  }

  get(x, y) { return this.grid[x][y]; }

  // Fill so NO 3-in-a-row exists at start (avoid colors that complete a run).
  fillNoMatches() {
    for (let x = 0; x < this.width; x++) {
      for (let y = 0; y < this.height; y++) {
        let color;
        do {
          color = this.rng.next(this.colorCount);
        } while (
          (x >= 2 && this.grid[x - 1][y] === color && this.grid[x - 2][y] === color) ||
          (y >= 2 && this.grid[x][y - 1] === color && this.grid[x][y - 2] === color)
        );
        this.grid[x][y] = color;
      }
    }
  }

  isAdjacent(ax, ay, bx, by) {
    return Math.abs(ax - bx) + Math.abs(ay - by) === 1;
  }

  swap(ax, ay, bx, by) {
    const tmp = this.grid[ax][ay];
    this.grid[ax][ay] = this.grid[bx][by];
    this.grid[bx][by] = tmp;
  }

  // Swap two adjacent tiles. Keep it only if it creates a match.
  trySwap(ax, ay, bx, by) {
    if (!this.isAdjacent(ax, ay, bx, by)) return false;
    this.swap(ax, ay, bx, by);
    if (findMatches(this.grid, this.width, this.height).size > 0) return true;
    this.swap(ax, ay, bx, by); // revert
    return false;
  }

  // ONE resolution pass: clear matches, gravity, refill. Returns tiles cleared.
  resolveStep() {
    const matched = findMatches(this.grid, this.width, this.height);
    if (matched.size === 0) return 0;
    for (const key of matched) {
      const [x, y] = key.split(",").map(Number);
      this.grid[x][y] = EMPTY;
    }
    this.applyGravity();
    this.refill();
    return matched.size;
  }

  applyGravity() {
    for (let x = 0; x < this.width; x++) {
      let writeY = 0;
      for (let y = 0; y < this.height; y++) {
        if (this.grid[x][y] !== EMPTY) {
          this.grid[x][writeY] = this.grid[x][y];
          if (writeY !== y) this.grid[x][y] = EMPTY;
          writeY++;
        }
      }
    }
  }

  refill() {
    for (let x = 0; x < this.width; x++)
      for (let y = 0; y < this.height; y++)
        if (this.grid[x][y] === EMPTY)
          this.grid[x][y] = this.rng.next(this.colorCount);
  }

  // ---- Animation-friendly variants -------------------------------------
  // Same mechanics as resolveStep(), but split into observable steps that
  // report what moved/spawned so the renderer can tween candies.

  clearMatches(matched) {
    for (const key of matched) {
      const [x, y] = key.split(",").map(Number);
      this.grid[x][y] = EMPTY;
    }
  }

  // Compacts each column toward y=0. Returns [{x, fromY, toY, color}] for every
  // surviving candy that actually moved.
  applyGravityMapped() {
    const moves = [];
    for (let x = 0; x < this.width; x++) {
      let writeY = 0;
      for (let y = 0; y < this.height; y++) {
        if (this.grid[x][y] !== EMPTY) {
          const color = this.grid[x][y];
          if (writeY !== y) {
            moves.push({ x, fromY: y, toY: writeY, color });
            this.grid[x][writeY] = color;
            this.grid[x][y] = EMPTY;
          }
          writeY++;
        }
      }
    }
    return moves;
  }

  // Fills the empty (top) cells. Returns [{x, y, color, startY}] where startY is
  // a position above the board the new candy should visually drop in from.
  refillMapped() {
    const spawns = [];
    for (let x = 0; x < this.width; x++) {
      let nEmpty = 0;
      for (let y = 0; y < this.height; y++)
        if (this.grid[x][y] === EMPTY) nEmpty++;
      if (nEmpty === 0) continue;
      for (let y = 0; y < this.height; y++) {
        if (this.grid[x][y] === EMPTY) {
          const color = this.rng.next(this.colorCount);
          this.grid[x][y] = color;
          spawns.push({ x, y, color, startY: y + nEmpty });
        }
      }
    }
    return spawns;
  }

  hasValidMove() {
    for (let x = 0; x < this.width; x++) {
      for (let y = 0; y < this.height; y++) {
        if (x + 1 < this.width && this.wouldMatch(x, y, x + 1, y)) return true;
        if (y + 1 < this.height && this.wouldMatch(x, y, x, y + 1)) return true;
      }
    }
    return false;
  }

  wouldMatch(ax, ay, bx, by) {
    this.swap(ax, ay, bx, by);
    const ok = findMatches(this.grid, this.width, this.height).size > 0;
    this.swap(ax, ay, bx, by);
    return ok;
  }

  // Like hasValidMove, but returns the two cells of the first swap that creates
  // a match — i.e. the pair to light up as a hint. Null if no move exists.
  findHint() {
    for (let x = 0; x < this.width; x++) {
      for (let y = 0; y < this.height; y++) {
        if (x + 1 < this.width && this.wouldMatch(x, y, x + 1, y))
          return [{ x, y }, { x: x + 1, y }];
        if (y + 1 < this.height && this.wouldMatch(x, y, x, y + 1))
          return [{ x, y }, { x, y: y + 1 }];
      }
    }
    return null;
  }

  reshuffle() {
    let safety = 0;
    do { this.fillNoMatches(); }
    while (
      (findMatches(this.grid, this.width, this.height).size > 0 || !this.hasValidMove())
      && safety++ < 50
    );
  }
}

function resizeCoinCanvas() {

function clearCoinRain() {

function spawnCoinRain() {
  resizeCoinCanvas();
  const w = window.innerWidth;
  const count = 50 + Math.floor(Math.random() * 51);
  coinRain = [];
  for (let i = 0; i < count; i++) {
    const size = 22 + Math.random() * 42;
    coinRain.push({
      x: Math.random() * w,
      y: -(30 + Math.random() * (window.innerHeight * 0.65 + 120)),
      vx: (Math.random() - 0.5) * 90,
      vy: 140 + Math.random() * 260,
      size,
      rot: Math.random() * Math.PI * 2,
      rotSpd: (Math.random() - 0.5) * 5.5,
      flipX: Math.random() < 0.5 ? -1 : 1,
      flipY: Math.random() < 0.5 ? -1 : 1,
    });
  }
}

function updateFlyingWalletCoins(now) {
  if (flyingWalletCoins.length === 0) return;
  const ready = coinImg.complete && coinImg.naturalWidth > 0;
  const aspect = ready ? coinImg.naturalWidth / coinImg.naturalHeight : 1;
  for (const c of flyingWalletCoins) {
    const t = Math.min(1, Math.max(0, (now - c.start) / c.duration));
    const e = 1 - Math.pow(1 - t, 2.2);
    const x = c.x + (c.tx - c.x) * e;
    const y = c.y + (c.ty - c.y) * e - Math.sin(t * Math.PI) * 32;
    const alpha = t < 0.1 ? t / 0.1 : 1;
    if (!ready) continue;
    const ch = c.size;
    const cw = ch * aspect;
    coinCtx.save();
    coinCtx.globalAlpha = alpha;
    coinCtx.drawImage(coinImg, x - cw / 2, y - ch / 2, cw, ch);
    coinCtx.restore();
  }
  flyingWalletCoins = flyingWalletCoins.filter((c) => now < c.start + c.duration);
}

function updateCoinRain(dt) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  coinCtx.clearRect(0, 0, w, h);
  updateFlyingWalletCoins(performance.now());

  if (!coinRain || coinRain.length === 0) {
    if (coinRain) clearCoinRain();
    return;
  }
  const ready = coinImg.complete && coinImg.naturalWidth > 0;
  const aspect = ready ? coinImg.naturalWidth / coinImg.naturalHeight : 1;

  for (const c of coinRain) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.rot += c.rotSpd * dt;
    if (c.y > h + c.size * 2) continue;
    if (!ready) continue;
    const ch = c.size;
    const cw = ch * aspect;
    coinCtx.save();
    coinCtx.translate(c.x, c.y);
    coinCtx.rotate(c.rot);
    coinCtx.scale(c.flipX, c.flipY);
    coinCtx.drawImage(coinImg, -cw / 2, -ch / 2, cw, ch);
    coinCtx.restore();
  }

  coinRain = coinRain.filter((c) => c.y <= h + c.size * 2);
  if (coinRain.length === 0) clearCoinRain();
}

// ---- Levels ---------------------------------------------------------------
// All 5 colors are always present; difficulty rises on these tunable dials:
//   grid    — the board grows from 6x6 up to 12x12. A bigger board is harder
//             to read and to find/line up combos on. This is the main dial.
//   target  — the points needed to clear the level (the gate to advance).
//   moves   — deterministic swap budget; fewer per level (tighter cushion) but
//             always floored so the goal stays reachable with normal play.
//   hints   — the idle helper turns off once it gets hard.
const MAX_LEVEL = 20;

// Deterministic move budget from level + goal. Not random. Cushion shrinks each
// level so later rounds are tighter; floor assumes ~28 pts per successful swap.
function movesForLevel(level, target, grid) {
  const PTS_ASSUMED = 36;
  const baseNeed = target / PTS_ASSUMED;
  const cushion = Math.max(0.18, 1.25 - (level - 1) * 0.055);
  let moves = Math.ceil(baseNeed * (1 + cushion));
  moves = Math.ceil(moves * (1 - (grid - 6) * 0.015));
  const beatableFloor = Math.ceil(target / 28) + 3;
  return Math.max(14, beatableFloor, moves);
}

function levelConfig(level) {
  const grid = Math.min(12, 6 + Math.floor((level - 1) / 3));
  const target = 150 + (level - 1) * 150;
  return {
    grid,
    target,
    moves: movesForLevel(level, target, grid),
    hints: level <= 6,
  };
}

function updateLastMatchCenter(matched) {

// ---- Hearts (lives) -------------------------------------------------------
// You start with MAX_HEARTS. Running out of moves on a level costs one heart.
// Hearts refill one at a time, HEART_REGEN_MS apart, even while the page is
// closed (we persist the count and a timestamp). At 0 hearts you can't play
// until one regenerates.
const MAX_HEARTS = 5;
const HEART_REGEN_MS = 10 * 60 * 1000; // one heart every 10 minutes
let hearts = MAX_HEARTS;
let heartTimer = Date.now(); // when the current regen interval started ticking

function loadHearts() {
  try {
    const h = parseInt(localStorage.getItem("matchDuel.hearts"), 10);
    const t = parseInt(localStorage.getItem("matchDuel.heartTimer"), 10);
    if (!isNaN(h)) hearts = Math.min(MAX_HEARTS, Math.max(0, h));
    if (!isNaN(t)) heartTimer = t;
  } catch (e) {}
}
function saveHearts() {
  try {
    localStorage.setItem("matchDuel.hearts", String(hearts));
    localStorage.setItem("matchDuel.heartTimer", String(heartTimer));
  } catch (e) {}
}

// Grant any hearts earned since heartTimer; advance the clock by whole intervals.
function regenHearts() {
  if (hearts >= MAX_HEARTS) { heartTimer = Date.now(); return; }
  const gained = Math.floor((Date.now() - heartTimer) / HEART_REGEN_MS);
  if (gained > 0) {
    hearts = Math.min(MAX_HEARTS, hearts + gained);
    heartTimer = hearts >= MAX_HEARTS ? Date.now() : heartTimer + gained * HEART_REGEN_MS;
    saveHearts();
  }
}

function loseHeart() {
  if (hearts <= 0) return;
  if (hearts === MAX_HEARTS) heartTimer = Date.now(); // start the regen clock
  hearts--;
  saveHearts();
}

// ms until the next heart, or 0 when full.
function msToNextHeart() {
  if (hearts >= MAX_HEARTS) return 0;
  return Math.max(0, HEART_REGEN_MS - (Date.now() - heartTimer));
}
function fmtTime(ms) {
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

// Record a real interaction so the idle timer restarts and any live hint stops.

}

function roundRect(px, py, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(px + r, py);
  ctx.arcTo(px + w, py, px + w, py + h, r);
  ctx.arcTo(px + w, py + h, px, py + h, r);
  ctx.arcTo(px, py + h, px, py, r);
  ctx.arcTo(px, py, px + w, py, r);
  ctx.closePath();
}

// Draw one candy. gx/gy are grid coords (y=0 bottom) and MAY be fractional so
// candies can be tweened between cells. dx/dy are extra pixel offsets (shake).
// sx/sy are independent width/height multipliers used for squash-and-stretch.
// glow (0..1) makes the sprite "light up" — a white halo plus an additive
// re-draw that brightens it — used by the idle hint pulse.
function drawCell(gx, gy, c, scale = 1, alpha = 1, dx = 0, dy = 0, sx = 1, sy = 1, glow = 0) {
  const size = CELL - GAP;
  const baseX = gx * CELL + GAP / 2;
  const baseY = (HEIGHT - 1 - gy) * CELL + GAP / 2;
  const cx = baseX + size / 2 + dx;
  const cy = baseY + size / 2 + dy;
  const w = size * scale * sx;
  const h = size * scale * sy;
  ctx.globalAlpha = alpha;
  if (glow > 0) {
    ctx.shadowColor = "rgba(255,255,255,0.95)";
    ctx.shadowBlur = 24 * glow;
  }
  const img = IMAGES[c % IMAGES.length];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
  } else {
    // Sprite not loaded yet — fall back to a flat swatch so nothing pops blank.
    ctx.fillStyle = SPARKLE_COLORS[c % SPARKLE_COLORS.length];
    roundRect(cx - w / 2, cy - h / 2, w, h, 10);
    ctx.fill();
  }
  if (glow > 0) {
    ctx.shadowBlur = 0;
    // Additive second pass brightens the sprite so it reads as "lit up".
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = alpha * glow * 0.6;
    if (img && img.complete && img.naturalWidth > 0)
      ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.globalAlpha = 1;
}

const sparkleOf = (c) => SPARKLE_COLORS[c % SPARKLE_COLORS.length];
const clear = () => ctx.clearRect(0, 0, WIDTH * CELL, HEIGHT * CELL);

// Static render of the settled board, including the selection highlight.
function render() {
  clear();
  for (let x = 0; x < WIDTH; x++) {
    for (let y = 0; y < HEIGHT; y++) {
      const c = board.get(x, y);
      if (c === EMPTY) continue;
      const selected = (x === selX && y === selY);
      drawCell(x, y, c, selected ? 1.08 : 1);
      if (selected) {
        const size = (CELL - GAP) * 1.08;
        const cx = x * CELL + GAP / 2 + (CELL - GAP) / 2;
        const cy = (HEIGHT - 1 - y) * CELL + GAP / 2 + (CELL - GAP) / 2;
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#ffffff";
        roundRect(cx - size / 2, cy - size / 2, size, size, 10);
        ctx.stroke();
      }
    }
  }
}

// Idle hint: redraw the settled board with the two suggested tiles pulsing —
// growing up to +20% and lighting up, then settling back. Driven by tick().
function renderHint(now) {
  const t = (now - hint.start) / HINT_DURATION_MS;        // 0..1 over the hint
  const p = Math.abs(Math.sin(t * Math.PI * HINT_PULSES)); // 0→1→0, pulsing
  const scale = 1 + 0.2 * p;                               // up to 20% bigger
  const hintSet = new Set(hint.cells.map((c) => c.x + "," + c.y));
  clear();
  for (let x = 0; x < WIDTH; x++)
    for (let y = 0; y < HEIGHT; y++) {
      const c = board.get(x, y);
      if (c === EMPTY) continue;
      if (hintSet.has(x + "," + y)) drawCell(x, y, c, scale, 1, 0, 0, 1, 1, p);
      else drawCell(x, y, c);
    }
}

// ---- Tiny tween runner ----------------------------------------------------
// Calls draw(easedProgress) every frame for `duration` ms, resolves when done.
function animate(duration, draw, easing) {
  return new Promise((resolve) => {
    const start = performance.now();
    function frame(now) {
      let t = (now - start) / duration;
      if (t > 1) t = 1;
      draw(easing ? easing(t) : t);
      if (t < 1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}
const easeIn = (t) => t * t;            // accelerate — reads like gravity/falling
const easeOut = (t) => 1 - (1 - t) * (1 - t);
// Overshoots past 1 then settles — gives moves a springy "jiggle" landing.
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};

// A damped squash-and-stretch wobble played on cells right after they land,
// so every move/drop ends with a little jiggle. cells: [{x,y}].
function animateJiggle(cells, speed = 1) {
  if (cells.length === 0) return Promise.resolve();
  const set = new Set(cells.map((c) => c.x + "," + c.y));
  return animate(Math.max(40, Math.round(260 * speed)), (t) => {
    const wob = Math.sin(t * Math.PI * 3) * (1 - t) * 0.24; // decays to 0
    clear();
    for (let x = 0; x < WIDTH; x++)
      for (let y = 0; y < HEIGHT; y++) {
        const c = board.get(x, y);
        if (c === EMPTY) continue;
        if (set.has(x + "," + y)) drawCell(x, y, c, 1, 1, 0, 0, 1 + wob, 1 - wob);
        else drawCell(x, y, c);
      }
  });
}

// ---- Sparkles + combo popup ----------------------------------------------

// Burst of little sparks out of every candy in a match (called each clear).
function spawnSparkles(matched) {
  for (const key of matched) {
    const [x, y] = key.split(",").map(Number);
    const cx = x * CELL + CELL / 2;
    const cy = (HEIGHT - 1 - y) * CELL + CELL / 2;
    const base = sparkleOf(board.get(x, y));
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 45 + Math.random() * 130;
      const life = 0.45 + Math.random() * 0.35;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,   // bias upward so they "spark" out
        life, maxLife: life,
        size: 2 + Math.random() * 4,
        color: Math.random() < 0.5 ? "#ffffff" : base,
      });
    }
  }
}

  COMBO_IMAGES[i] = img;
});

const comboWord = (n) => (COMBO_TIERS[n] && COMBO_TIERS[n].label) || (n + "× COMBO");

// Popup grows with each tier (Double smallest → Nonuple largest; 10+ keeps scaling).
function comboPopupMetrics(combo) {
  const tier = Math.max(2, combo);
  return {
    height: 64 + (tier - 2) * 14,
    scaleMul: 1.45 + (tier - 2) * 0.11,
    fontSize: 44 + (tier - 2) * 8,
  };
}

function showCombo(n) {
  comboPopup = { combo: n, text: comboWord(n), start: performance.now() };
}

const PASS_LEVEL_FILES = [
  "images/passingLevel/GoodJob.png",
  "images/passingLevel/YouDidIt.png",
  "images/passingLevel/Awesome.png",
];
const PASS_LEVEL_IMAGES = PASS_LEVEL_FILES.map((src) => {
  const im = new Image();
  im.src = src;
  return im;
});
let passLevelPopup = null;

function showPassLevelCelebration() {
  return new Promise((resolve) => {
    passLevelPopup = {
      img: PASS_LEVEL_IMAGES[Math.floor(Math.random() * PASS_LEVEL_IMAGES.length)],
      start: performance.now(),
      height: 80,
      scaleMul: 1.55,
      onDone: resolve,
    };
  });
}

// Draw a centered popup image (combo / pass-level) on the fx canvas.
function drawCenterPopup(now, popup, grow, hold, fade) {
  const total = grow + hold + fade;
  const t = (now - popup.start) / 1000;
  let scale, alpha;
  if (t < grow) {
    const p = t / grow;
    scale = 0.35 + 0.65 * easeOutBack(p);
    alpha = Math.min(1, p * 1.8);
  } else if (t < grow + hold) {
    scale = 1; alpha = 1;
  } else if (t < total) {
    const f = (t - grow - hold) / fade;
    scale = 1 + 0.22 * f;
    alpha = 1 - f;
  } else {
    return false;
  }
  const s = scale * popup.scaleMul;
  fxCtx.save();
  fxCtx.translate((WIDTH * CELL) / 2, (HEIGHT * CELL) / 2);
  const glowR = (80 + popup.height * 0.55) * s;
  const bloom = fxCtx.createRadialGradient(0, 0, 0, 0, 0, glowR);
  bloom.addColorStop(0, "rgba(255, 255, 255, " + (alpha * 0.10) + ")");
  bloom.addColorStop(0.45, "rgba(150, 190, 255, " + (alpha * 0.05) + ")");
  bloom.addColorStop(1, "rgba(150, 190, 255, 0)");
  fxCtx.fillStyle = bloom;
  fxCtx.beginPath();
  fxCtx.arc(0, 0, glowR, 0, Math.PI * 2);
  fxCtx.fill();
  fxCtx.globalAlpha = alpha;
  fxCtx.scale(s, s);
  const targetImg = popup.img || COMBO_IMAGES[popup.combo];
  if (targetImg && targetImg.complete && targetImg.naturalWidth > 0) {
    const h = popup.height;
    const w = targetImg.naturalWidth * (h / targetImg.naturalHeight);
    fxCtx.drawImage(targetImg, -w / 2, -h / 2, w, h);
  } else if (popup.text) {
    const fs = popup.fontSize || 44;
    fxCtx.textAlign = "center";
    fxCtx.textBaseline = "middle";
    fxCtx.font = "bold " + fs + "px -apple-system, system-ui, sans-serif";
    fxCtx.lineWidth = Math.max(4, Math.round(fs * 0.12));
    fxCtx.strokeStyle = "rgba(0,0,0,0.6)";
    fxCtx.strokeText(popup.text, 0, 0);
    fxCtx.fillStyle = "#ffe14d";
    fxCtx.fillText(popup.text, 0, 0);
  }
  fxCtx.restore();
  return true;
}

// Double starts the 3s window (+20%). Each higher chain step upgrades the rate and
// refreshes the timer: Triple +30%, Quadruple +40%, +10% per step.
function comboTierBonusRate(combo) {
  return combo >= 2 ? combo * 0.10 : 0;
}

function refreshComboBonusWindow(combo, now) {
  if (combo < 2) return;
  comboBonusPct = Math.max(comboBonusPct, comboTierBonusRate(combo));
  comboBonusUntil = now + COMBO_BONUS_MS;
}

function awardCascadeScore(tileCount, cascadeCombo) {
  const base = tileCount * 10;
  if (cascadeCombo < 2) return base;
  refreshComboBonusWindow(cascadeCombo, performance.now());
  return Math.round(base * (1 + comboBonusPct));
}

const comboBonusEl = document.getElementById("combo-bonus");
const comboBonusLabel = document.getElementById("combo-bonus-label");
const comboBonusFill = document.getElementById("combo-bonus-fill");

function updateComboBonusHud(now) {
  if (now < comboBonusUntil && comboBonusPct > 0) {
    comboBonusEl.classList.add("active");
    comboBonusLabel.textContent = "Combo bonus +" + Math.round(comboBonusPct * 100) + "%";
    comboBonusFill.style.transform = "scaleX(" + ((comboBonusUntil - now) / COMBO_BONUS_MS) + ")";
  } else {
    comboBonusEl.classList.remove("active");
    comboBonusPct = 0;
    comboBonusUntil = 0;
  }
}

// Advance + draw sparkles and the combo popup. Driven by the main rAF loop.
function updateFx(now, dt) {
  fxCtx.clearRect(0, 0, WIDTH * CELL, HEIGHT * CELL);

  // Sparkles
  const G = 320; // gravity px/s^2
  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += G * dt;
  }
  particles = particles.filter((p) => p.life > 0);

  fxCtx.shadowBlur = 8;
  for (const p of particles) {
    fxCtx.globalAlpha = Math.max(0, p.life / p.maxLife);
    fxCtx.fillStyle = p.color;
    fxCtx.shadowColor = p.color;
    fxCtx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  fxCtx.shadowBlur = 0;
  fxCtx.globalAlpha = 1;

  if (passLevelPopup) {
    const metrics = comboPopupMetrics(2);
    passLevelPopup.height = metrics.height;
    passLevelPopup.scaleMul = metrics.scaleMul;
    if (!drawCenterPopup(now, passLevelPopup, 0.26, 2.0, 0.2)) {
      const done = passLevelPopup.onDone;
      passLevelPopup = null;
      if (done) done();
    }
  } else if (comboPopup) {
    const metrics = comboPopupMetrics(comboPopup.combo);
    comboPopup.height = metrics.height;
    comboPopup.scaleMul = metrics.scaleMul;
    comboPopup.text = comboPopup.text || comboWord(comboPopup.combo);
    comboPopup.fontSize = metrics.fontSize;
    if (!drawCenterPopup(now, comboPopup, 0.26, 0.4, 0.34)) comboPopup = null;
  }
}

// Invalid swap: both candies jitter back and forth along the swap axis.
function animateShake(ax, ay, bx, by) {
  const horizontal = ay === by;
  return animate(360, (t) => {
    const amp = Math.sin(t * Math.PI * 5) * 8 * (1 - t);
    clear();
    for (let x = 0; x < WIDTH; x++)
      for (let y = 0; y < HEIGHT; y++) {
        const c = board.get(x, y);
        if (c === EMPTY) continue;
        const shaken = (x === ax && y === ay) || (x === bx && y === by);
        const dx = shaken && horizontal ? amp : 0;
        const dy = shaken && !horizontal ? -amp : 0;
        drawCell(x, y, c, 1, 1, dx, dy);
      }
  });
}

// Valid swap: the two candies slide into each other's cell. Grid is already
// swapped, so each target cell's candy is tweened in from the other position.
function animateSwap(ax, ay, bx, by, speed = 1) {
  const ca = board.get(ax, ay), cb = board.get(bx, by);
  const targets = new Set([ax + "," + ay, bx + "," + by]);
  return animate(Math.max(40, Math.round(140 * speed)), (t) => {
    clear();
    for (let x = 0; x < WIDTH; x++)
      for (let y = 0; y < HEIGHT; y++) {
        const c = board.get(x, y);
        if (c === EMPTY || targets.has(x + "," + y)) continue;
        drawCell(x, y, c);
      }
    drawCell(bx + (ax - bx) * t, by + (ay - by) * t, ca);
    drawCell(ax + (bx - ax) * t, ay + (by - ay) * t, cb);
  }, easeOutBack);
}

// Matched candies shrink and fade out before being cleared.
function animateClear(matched, speed = 1) {
  return animate(Math.max(40, Math.round(170 * speed)), (t) => {
    clear();
    for (let x = 0; x < WIDTH; x++)
      for (let y = 0; y < HEIGHT; y++) {
        const c = board.get(x, y);
        if (c === EMPTY) continue;
        if (matched.has(x + "," + y)) drawCell(x, y, c, 1 - t, 1 - t);
        else drawCell(x, y, c);
      }
  }, easeIn);
}

// Soft light under combo'ed objects: a single smooth fade in then out (no
// strobing on/off) at a gentle, low opacity.
function animateComboPulse(matched, speed = 1) {
  return animate(Math.max(40, Math.round(650 * speed)), (t) => {
    const glow = Math.sin(t * Math.PI); // 0 → 1 → 0, one smooth rise and fall
    clear();

    // Gentle underglow beneath each matched candy.
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const key of matched) {
      const [x, y] = key.split(",").map(Number);
      const size = CELL - GAP;
      // Replicate coordinate math from drawCell to align exactly
      const cx = x * CELL + GAP / 2 + size / 2;
      const cy = (HEIGHT - 1 - y) * CELL + GAP / 2 + size / 2;

      const rad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 1.1);
      rad.addColorStop(0, "rgba(255, 246, 214, " + (glow * 0.5) + ")");
      rad.addColorStop(0.6, "rgba(255, 224, 160, " + (glow * 0.22) + ")");
      rad.addColorStop(1, "rgba(255, 224, 160, 0)");
      ctx.fillStyle = rad;
      ctx.beginPath();
      ctx.arc(cx, cy, size * 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    for (let x = 0; x < WIDTH; x++)
      for (let y = 0; y < HEIGHT; y++) {
        const c = board.get(x, y);
        if (c === EMPTY) continue;
        drawCell(x, y, c, 1);
      }
  });
}

// Candies above cleared gaps fall down, and fresh candies drop in from the top.
function animateFall(moves, spawns, speed = 1) {
  const items = [];
  for (const m of moves) items.push({ x: m.x, fromY: m.fromY, toY: m.toY, color: m.color });
  for (const s of spawns) items.push({ x: s.x, fromY: s.startY, toY: s.y, color: s.color });
  const targets = new Set(items.map((i) => i.x + "," + i.toY));
  return animate(Math.max(40, Math.round(230 * speed)), (t) => {
    clear();
    for (let x = 0; x < WIDTH; x++)
      for (let y = 0; y < HEIGHT; y++) {
        const c = board.get(x, y);
        if (c === EMPTY || targets.has(x + "," + y)) continue;
        drawCell(x, y, c);
      }
    for (const it of items)
      drawCell(it.x, it.fromY + (it.toY - it.fromY) * t, it.color);
  }, easeIn);
}

async function resolveCascades(fast) {
  const spd = fast ? 0.48 : 1;
  resolving = true;
  let combo = 0;
  while (true) {
    const matched = findMatches(board.grid, WIDTH, HEIGHT);
    if (matched.size === 0) break;
    combo++;
    updateLastMatchCenter(matched);
    score += awardCascadeScore(matched.size, combo);
    scoreEl.textContent = score;

    spawnSparkles(matched);          // spark on every cleared match
    if (combo >= 2) {
      showCombo(combo); // Double, Triple, ... for chained combos
      await animateComboPulse(matched, spd);
    }

    await animateClear(matched, spd);
    board.clearMatches(matched);
    const moves = board.applyGravityMapped();
    const spawns = board.refillMapped();
    await animateFall(moves, spawns, spd);

    // Jiggle every candy that just landed (moved or dropped in).
    const landed = [
      ...moves.map((m) => ({ x: m.x, y: m.toY })),
      ...spawns.map((s) => ({ x: s.x, y: s.y })),
    ];
    await animateJiggle(landed, spd);
  }

  render();
  if (!board.hasValidMove()) { board.reshuffle(); render(); }
  resolving = false;
  lastActivity = performance.now(); // start the idle countdown after a settle
  checkLevelEnd();
}

const AUTO_MOVE_SPEED = 0.48;
const AUTO_MOVE_GAP_MS = 90;

function autoMoveDelay() {
  return new Promise((resolve) => setTimeout(resolve, AUTO_MOVE_GAP_MS));
}

// Goal reached: show passing-level art, then auto-play leftover moves / win UI.
async function passLevelSequence() {
  passCelebrationPending = true;
  await showPassLevelCelebration();
  passCelebrationPending = false;
  if (gameOver) return;
  if (movesLeft > 0) await autoFinishRemainingMoves();
  else winLevel();
}

// After the goal is met, burn leftover moves on-screen (fast) before the win UI.
async function autoFinishRemainingMoves() {
  if (autoFinishing || gameOver) return;
  autoFinishing = true;
  hint = null;
  const autoCoinPerMove = autoMoveCoinBonus(currentLevel);

  while (movesLeft > 0 && score >= levelTarget && !gameOver) {
    let cells = board.findHint();
    if (!cells) {
      board.reshuffle();
      render();
      await autoMoveDelay();
      cells = board.findHint();
      if (!cells) break;
    }
    const ax = cells[0].x, ay = cells[0].y, bx = cells[1].x, by = cells[1].y;
    if (!board.trySwap(ax, ay, bx, by)) break;

    movesLeft--;
    movesEl.textContent = movesLeft;
    resolving = true;
    await animateSwap(ax, ay, bx, by, AUTO_MOVE_SPEED);
    await resolveCascades(true);
    addCoins(autoCoinPerMove);
    await autoMoveDelay();
  }

  autoFinishing = false;
  if (!gameOver && score >= levelTarget) winLevel();
}

// Win or lose once a cascade settles (and from tick when idle).
function checkLevelEnd() {
  if (gameOver || resolving || passCelebrationPending) return;
  if (score >= levelTarget) {
    if (autoFinishing) return;
    if (!levelGoalCelebrated) {
      levelGoalCelebrated = true;
      passLevelSequence();
    }
    return;
  }
  if (movesLeft <= 0) failOutOfMoves();
}

function failOutOfMoves() {
  clearCoinRain();
  gameOver = true;
  won = false;
  loseHeart();
  renderHearts();
  ovBig.textContent = "Out of moves!  " + score + " / " + levelTarget;
  ovSub.textContent = hearts > 0
    ? "Lost a life — tap to retry"
    : "Out of lives — tap for the menu (refills in " + fmtTime(msToNextHeart()) + ")";
  overlay.classList.add("show");
}

function pixelToCell(clientX, clientY) {
  const p = localPos({ clientX, clientY });
  const gx = Math.floor(p.x / CELL);
  const gyFromTop = Math.floor(p.y / CELL);
  const gy = HEIGHT - 1 - gyFromTop;
  if (gx < 0 || gx >= WIDTH || gy < 0 || gy >= HEIGHT) return null;
  return { gx, gy };
}

// ---- Drag input -----------------------------------------------------------
// Grab a candy and drag it toward an adjacent cell to swap (like Candy Crush).
let dragging = false, dragFromX = -1, dragFromY = -1;
let dragStart = { x: 0, y: 0 }, dragCur = { x: 0, y: 0 };

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const localPos = (e) => {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width) / DPR,
    y: (e.clientY - r.top) * (canvas.height / r.height) / DPR
  };
};

// Which adjacent cell the current drag points at — or null if under threshold.
function dragDirection() {
  const dx = dragCur.x - dragStart.x, dy = dragCur.y - dragStart.y;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (adx < CELL * 0.33 && ady < CELL * 0.33) return null;
  if (adx > ady) return { dx: dx > 0 ? 1 : -1, dy: 0 };
  return { dx: 0, dy: dy > 0 ? -1 : 1 }; // screen-down = lower grid row
}

// Live preview while dragging: the grabbed candy follows the cursor (clamped to
// one cell along the chosen axis) and the neighbor slides the opposite way.
function renderDrag() {
  const dir = dragDirection();
  let dxp = dragCur.x - dragStart.x, dyp = dragCur.y - dragStart.y;
  let nx = -1, ny = -1;
  if (dir) {
    if (dir.dx !== 0) { dyp = 0; dxp = clamp(dxp, -CELL, CELL); }
    else { dxp = 0; dyp = clamp(dyp, -CELL, CELL); }
    nx = dragFromX + dir.dx; ny = dragFromY + dir.dy;
    if (nx < 0 || nx >= WIDTH || ny < 0 || ny >= HEIGHT) { nx = -1; }
  } else {
    dxp = clamp(dxp, -CELL * 0.5, CELL * 0.5);
    dyp = clamp(dyp, -CELL * 0.5, CELL * 0.5);
  }

  clear();
  for (let x = 0; x < WIDTH; x++)
    for (let y = 0; y < HEIGHT; y++) {
      const c = board.get(x, y);
      if (c === EMPTY) continue;
      if (x === dragFromX && y === dragFromY) continue; // grabbed: drawn last, on top
      if (x === nx && y === ny) { drawCell(x, y, c, 1, 1, -dxp, -dyp); continue; }
      drawCell(x, y, c);
    }
  drawCell(dragFromX, dragFromY, board.get(dragFromX, dragFromY), 1.12, 1, dxp, dyp);
}

// Pointer events (mouse + touch + pen). touch-action:none on #game stops scroll
// from stealing drags on mobile.
function finishDrag() {
  if (!dragging) return;
  noteActivity();
  dragging = false;
  const dir = dragDirection();
  const fromX = dragFromX, fromY = dragFromY;
  dragFromX = dragFromY = -1;

  if (!dir) { render(); return; }
  const tx = fromX + dir.dx, ty = fromY + dir.dy;
  if (tx < 0 || tx >= WIDTH || ty < 0 || ty >= HEIGHT) { render(); return; }

  if (movesLeft <= 0) { render(); return; }

  resolving = true;
  if (board.trySwap(fromX, fromY, tx, ty)) {
    movesLeft--;
    movesEl.textContent = movesLeft;
    animateSwap(fromX, fromY, tx, ty).then(resolveCascades);
  } else {
    animateShake(fromX, fromY, tx, ty).then(() => { resolving = false; render(); });
  }
}

canvas.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 && e.pointerType === "mouse") return;
  if (gameOver || resolving || autoFinishing || passCelebrationPending || movesLeft <= 0) return;
  const cell = pixelToCell(e.clientX, e.clientY);
  if (!cell) return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  noteActivity();
  dragging = true;
  dragFromX = cell.gx; dragFromY = cell.gy;
  dragStart = localPos(e); dragCur = { ...dragStart };
  renderDrag();
});

canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  e.preventDefault();
  lastActivity = performance.now();
  dragCur = localPos(e);
  renderDrag();
});

canvas.addEventListener("pointerup", (e) => {
  if (!dragging) return;
  e.preventDefault();
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  finishDrag();
});

canvas.addEventListener("pointercancel", (e) => {
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  if (!dragging) return;
  dragging = false;
  dragFromX = dragFromY = -1;
  render();
});

window.addEventListener("keydown", (e) => {
  noteActivity();
  if ((e.key === "r" || e.key === "R") && inLevel) {
    startLevel(currentLevel); // restart the current level on a fresh board
  }
});

function tick(ts) {
  if (!lastTs) lastTs = ts;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;

  updateCoinRain(dt);
  updateLevelPassIdle(ts);

  if (!inLevel) { requestAnimationFrame(tick); return; } // idle on the menu/splash

  updateComboBonusHud(ts);
  updateFx(ts, dt);

  if (!gameOver && !resolving && !passCelebrationPending) checkLevelEnd();

  // Idle hint: after HINT_IDLE_MS with no input, pulse a valid move. While idle
  // the board is otherwise static, so the hint owns the per-frame redraw here.
  if (hintsEnabled && !gameOver && !resolving && !autoFinishing && !passCelebrationPending && !dragging) {
    if (!hint && ts - lastActivity > HINT_IDLE_MS) {
      const cells = board.findHint();
      if (cells) hint = { cells, start: ts };
      else lastActivity = ts; // no move to suggest — wait out another window
    }
    if (hint) {
      if (ts - hint.start >= HINT_DURATION_MS) {
        hint = null;
        lastActivity = ts; // settle, then re-trigger after another idle window
        render();
      } else {
        renderHint(ts);
      }
    }
  }
  requestAnimationFrame(tick);
}

// Goal reached: lock the round, unlock the next level (and persist it).
function winLevel() {
  if (gameOver) return;
  autoFinishing = false;
  gameOver = true;
  won = true;
  hint = null;
  addCoins(levelCoinReward(currentLevel));
  if (currentLevel === unlockedLevel && unlockedLevel < MAX_LEVEL) {
    unlockedLevel++;
    saveUnlocked();
  }
  showLevelPass();
  spawnCoinRain();
}

const winDim = document.getElementById("win-dim");
const levelPass = document.getElementById("level-pass");
const levelPassPanel = document.querySelector("#level-pass .level-pass-panel");
const btnNextLevel = document.getElementById("btn-next-level");
const btnBackMenu = document.getElementById("btn-back-menu");
let levelPassIdleAt = 0;
let levelPassPulseEnd = 0;

function showLevelPass() {
  btnNextLevel.style.display = currentLevel < MAX_LEVEL ? "" : "none";
  btnNextLevel.classList.remove("pulsing");
  levelPassPulseEnd = 0;
  levelPassIdleAt = performance.now();
  levelPass.classList.remove("enter-in");
  winDim.classList.add("show");
  levelPass.classList.add("show");
  void levelPassPanel.offsetWidth;
  levelPass.classList.add("enter-in");
}

function hideLevelPass() {
  winDim.classList.remove("show");
  levelPass.classList.remove("show", "enter-in");
  btnNextLevel.classList.remove("pulsing");
  levelPassPulseEnd = 0;
}

function noteLevelPassActivity() {
  levelPassIdleAt = performance.now();
  btnNextLevel.classList.remove("pulsing");
  levelPassPulseEnd = 0;
}

function updateLevelPassIdle(now) {
  if (!levelPass.classList.contains("show")) return;
  if (btnNextLevel.style.display === "none") return;
  if (levelPassPulseEnd > 0) {
    if (now >= levelPassPulseEnd) {
      btnNextLevel.classList.remove("pulsing");
      levelPassPulseEnd = 0;
      levelPassIdleAt = now;
    }
    return;
  }
  if (now - levelPassIdleAt >= 3000) {
    btnNextLevel.classList.add("pulsing");
    levelPassPulseEnd = now + 3000;
  }
}

levelPass.addEventListener("pointerdown", noteLevelPassActivity);
btnNextLevel.addEventListener("click", () => {
  hideLevelPass();
  if (currentLevel < MAX_LEVEL) startLevel(currentLevel + 1);
  else returnToMenu();
});
btnBackMenu.addEventListener("click", () => {
  hideLevelPass();
  returnToMenu();
});

const splash = document.getElementById("splash");
const splashLogo = document.getElementById("splash-logo");
const splashLoader = document.getElementById("splash-loader");
const SPLASH_ASSETS = {
  logo: { desktop: "logobg.png", mobile: "mobileLogobg.png" },
  loader: { desktop: "loader.png", mobile: "MobileLoader.png" },
};
const mobileSplashMq = window.matchMedia("(max-width: 768px)");

function isMobileSplash() {
  return mobileSplashMq.matches;
}

function applySplashAssets() {
  const mobile = isMobileSplash();
  splashLogo.src = mobile ? SPLASH_ASSETS.logo.mobile : SPLASH_ASSETS.logo.desktop;
  splashLoader.src = mobile ? SPLASH_ASSETS.loader.mobile : SPLASH_ASSETS.loader.desktop;
}

applySplashAssets();
mobileSplashMq.addEventListener("change", applySplashAssets);
const menuShell = document.getElementById("menu-shell");
const levelMenu = document.getElementById("level-menu");
const gameUi = document.getElementById("game-ui");
const levelButtons = Array.from(document.querySelectorAll(".level-btn"));
const heartsBar = document.getElementById("hearts-bar");
const playHearts = document.getElementById("play-hearts");
const menuBtn = document.getElementById("menu-btn");

// Five ♥ glyphs, filled up to the current heart count.
function heartsHtml() {
  let s = "";
  for (let i = 0; i < MAX_HEARTS; i++)
    s += '<span class="' + (i < hearts ? "heart-full" : "heart-empty") + '">♥</span>';
  return s;
}
// Update the menu bar (with a regen countdown) and the in-game HUD lives.
function renderHearts() {
  const html = heartsHtml();
  const regen = hearts < MAX_HEARTS
    ? '<span class="regen">next in ' + fmtTime(msToNextHeart()) + "</span>"
    : "";
  heartsBar.innerHTML = html + regen +
    '<span class="menu-coins">' + coinsDisplayHtml() + "</span>";
  playHearts.innerHTML = html;
  const playCoins = document.getElementById("play-coins");
  if (playCoins) playCoins.innerHTML = coinsDisplayHtml();
}

// Paint the menu so levels up to `unlockedLevel` are playable and the rest read
// as locked. Called whenever the menu is shown.
function refreshMenu() {
  levelButtons.forEach((btn, i) => {
    const unlocked = (i + 1) <= unlockedLevel;
    btn.classList.toggle("active", unlocked);
    btn.classList.toggle("locked", !unlocked);
  });
  renderHearts();
}

// Begin (or restart) a level: difficulty, grid size, fresh seed, board. Costs
// nothing up front — but with no lives left you can't play, so bounce to menu.
function startLevel(level) {
  autoFinishing = false;
  hideLevelPass();
  clearCoinRain();
  regenHearts();
  if (hearts <= 0) { returnToMenu(); return; }

  const cfg = levelConfig(level);
  currentLevel = level;
  WIDTH = HEIGHT = cfg.grid;   // the board grows with the level
  resizeBoard();
  levelTarget = cfg.target;
  levelMoves = cfg.moves;
  hintsEnabled = cfg.hints;
  seed = (seed * 1664525 + 1013904223) >>> 0;

  menuShell.classList.remove("show");
  levelMenu.style.display = "none";
  gameUi.style.display = "flex";
  inLevel = true;
  newGame();
}

function returnToMenu() {
  hideLevelPass();
  clearCoinRain();
  inLevel = false;
  gameOver = false;
  gameUi.style.display = "none";
  refreshMenu();
  menuShell.classList.add("show");
  levelMenu.style.display = "grid";
}

levelButtons.forEach((btn, i) => {
  btn.addEventListener("click", () => {
    regenHearts();
    if ((i + 1) <= unlockedLevel && hearts > 0) startLevel(i + 1);
    else renderHearts();
  });
});

menuBtn.addEventListener("click", returnToMenu);

// Loss overlay only — wins use the level-pass buttons.
function onOverlayTap() {
  if (!gameOver || won) return;
  startLevel(currentLevel);
}
overlay.addEventListener("pointerup", (e) => {
  if (e.button !== 0 && e.pointerType === "mouse") return;
  onOverlayTap();
});

// Lives persist across sessions and refill in real time; tick the regen + UI
// once a second so the menu countdown stays live and hearts reappear on time.
loadHearts();
loadCoins();
regenHearts();
renderHearts();
setInterval(() => { regenHearts(); renderHearts(); }, 1000);

// 1. Show logobg for 3 seconds
setTimeout(() => {
  splashLogo.classList.remove("active");
  splashLoader.classList.add("active");

  // 2. Show loader for 2 seconds, then reveal the level menu
  setTimeout(() => {
    splash.style.display = "none";
    refreshMenu();
    menuShell.classList.add("show");
    levelMenu.style.display = "grid";
  }, 2000);
}, 3000);

// One render loop for the whole app; it no-ops until a level is in progress.
requestAnimationFrame(tick);

</script>
</body>
</html>
