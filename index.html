<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Match Duel — match-3 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu-shell">
    <div id="menu-wallet"></div>
    <div id="level-menu">
      <div class="arena-carousel">
        <button type="button" class="arena-nav" id="arena-prev" aria-label="Previous arena">‹</button>
        <div id="arenas-scroll"></div>
        <button type="button" class="arena-nav" id="arena-next" aria-label="Next arena">›</button>
      </div>
    </div>
  </div>

  <div id="game-ui">
    <div id="hud">
      <div><div class="label">Level</div><div class="val" id="level">1</div></div>
      <div><div class="label">Score</div><div class="val" id="score">0</div></div>
      <div class="hud-goals"><div class="label" id="goal-label">Goals</div><div class="val" id="goal">0</div></div>
      <div><div class="label">Moves</div><div class="val" id="moves">0</div></div>
      <div><div class="label">Lives</div><div class="val" id="play-hearts"></div></div>
      <div><div class="label">Coins</div><div class="val wallet-coins" id="play-coins"></div></div>
    </div>
    <div id="combo-bonus">
      <div class="bonus-label" id="combo-bonus-label">Combo bonus +20%</div>
      <div class="bonus-track"><div class="bonus-fill" id="combo-bonus-fill"></div></div>
    </div>
    <div id="board-area">
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="grid-overlay"></div>
      <canvas id="fx"></canvas>
      <div id="overlay">
        <div class="big" id="ovBig">Level over</div>
        <div class="sub" id="ovSub">Press R or click to play again</div>
      </div>
    </div>
    </div>
    <div id="hint">Drag to swap. Match 3+ to clear clouds, idols, and complete level goals.</div>
    <button id="menu-btn">☰ Menu</button>
  </div>

  <div id="win-dim"></div>
  <canvas id="coin-fx"></canvas>

  <div id="level-pass">
    <div class="level-pass-panel">
      <img class="level-pass-banner" src="images/ui/levelpassed.png" alt="Good Job! You passed the level!" decoding="async" loading="eager" />
      <div class="level-pass-actions">
        <button type="button" id="btn-back-menu" class="level-pass-btn" aria-label="Back to Menu">
          <img src="images/ui/BackToMenu.png" alt="Back to Menu" decoding="async" loading="eager" />
        </button>
        <button type="button" id="btn-next-level" class="level-pass-btn" aria-label="Next Level">
          <img src="images/ui/NextLevel.png" alt="Next Level" decoding="async" loading="eager" />
        </button>
      </div>
    </div>
  </div>

<script src="level-objectives.js"></script>
<script src="game.js"></script>
</body>
</html>
